services:
  repricer:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN apt-get update \
            && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tzdata \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY app.py adapters.py demo.py engine.py ut_odata.py ./
        COPY static/ ./static/
        RUN mkdir -p /data && chown 10001:10001 /data
        USER 10001:10001
        CMD ["python", "app.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      REPRICER_HOST: "0.0.0.0"
      REPRICER_PORT: "3000"
      REPRICER_STATE: /data/state.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - repricer-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:3000/', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  repricer-data:
