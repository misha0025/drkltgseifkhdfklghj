<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Репрайсер · Wildberries</title>
<link rel="stylesheet" href="/style.css">
<script defer src="/app.js"></script>
</head>
<body>
<aside>
  <div class="brand"><span class="mark" aria-hidden="true">↗</span><div>Репрайсер<small>Wildberries · Демо</small></div></div>
  <nav aria-label="Разделы">
    <button data-tab="products" aria-current="page"><span aria-hidden="true">▦</span> Товары</button>
    <button data-tab="rules"><span aria-hidden="true">☷</span> Правила</button>
    <button data-tab="integrations"><span aria-hidden="true">⛓</span> Интеграции</button>
    <button data-tab="report"><span aria-hidden="true">▥</span> Отчёт</button>
  </nav>
</aside>
<main>
  <header><div><h1 id="title">Товары</h1><p id="subtitle">Рекомендации по ценам и статус их применения</p></div>
    <div class="header-actions"><span id="updated"></span></div>
  </header>
  <div id="notice" role="status" aria-live="polite"></div>
  <section id="content" aria-label="Содержимое раздела"><p>Загрузка…</p></section>
</main>
<dialog id="manual-price" aria-labelledby="manual-title" aria-describedby="manual-context">
  <form data-action="manual">
    <div><h2 id="manual-title">Изменить цену WB</h2><p id="manual-context"></p></div>
    <input type="hidden" name="sku">
    <label>Новая цена, ₽<input name="price" type="number" min="0.01" max="100000000" step="0.01" required autofocus></label>
    <div id="manual-error" role="alert"></div>
    <div class="actions"><button class="primary">Добавить в пакет</button><button type="button" id="manual-cancel">Отмена</button></div>
  </form>
</dialog>
</body>
</html>
